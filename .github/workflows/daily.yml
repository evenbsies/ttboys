name: daily-fetch

on:
  schedule:
    # 每天 UTC 22:00 运行（北京时间次日 06:00），赶在源更新后、你起床前出好配置
    - cron: '0 22 * * *'
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取并合并公开源
        run: python fetch_sources.py

      - name: 生成短文件名副本（供短订阅地址使用）
        run: cp merged.json m.json

      - name: 提交并推送结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merged.json m.json status.json
          if git diff --cached --quiet; then
            echo "配置无变化，跳过提交"
          else
            git commit -m "daily update $(date -u +%Y-%m-%d)"
            git push
          fi
